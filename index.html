<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>青青 AI 互動角色 Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden;
         font-family: 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif; }

  /* 16:9 舞台：背景、角色、對話框三層皆為滿版圖，等比縮放 */
  #ai-character-widget {
    position: relative; aspect-ratio: 16 / 9; container-type: inline-size; overflow: hidden;
    width: min(100vw, calc(100vh * 16 / 9), 1920px);
    background: #000 center / 100% 100% no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  }
  #char-layer { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  #char-img { width: 100%; height: 100%; object-fit: contain; display: block; }

  /* 對話框圖（滿版圖層，位於角色之上） */
  #chat-bubble-container {
    position: absolute; bottom: 0; width: 85%; height: 100%; z-index: 3;
    background: center / 100% 100% no-repeat; pointer-events: none;
  }
  /* 文字與控制列：以舞台百分比定位，對齊對話框內側（可微調 left / top / height） */
  #chat-text {
    position: absolute; z-index: 4; left: 16.5%; right: 10%; top: 66.5%; height: 14%;
    font-size: max(13px, 2.6cqw); font-weight: 500; color: #222; line-height: 1.35; text-align: left;
    overflow-y: auto; word-break: break-all; white-space: pre-wrap; scrollbar-width: thin;
  }
  .cursor::after { content: "▍"; color: #0b0706; animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #controls {
    position: absolute; z-index: 4; left: 16.5%; right: 10%; top: 79.5%; height: 9%;
    display: flex; gap: .8cqw; align-items: center; justify-content: flex-end;
  }
  #talk-btn, #send {
    background: #0b0706; color: #fff; border: 0; border-radius: 12px; cursor: pointer; font-weight: bold;
    padding: .8cqw 2.5cqw; font-size: max(13px, 2cqw); box-shadow: 0 4px 10px rgba(0,0,0,.3);
    transition: .2s; white-space: nowrap;
  }
  #talk-btn:active, #send:active { transform: scale(.95); }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  #msg {
    flex: 1; min-width: 0; border: 1px solid #ccc; outline: 0; border-radius: 12px;
    padding: .8cqw 1.6cqw; font-size: max(16px, 1.8cqw); /* 16px 以上可避免 iOS 聚焦時自動放大 */
    background: rgba(255,255,255,.95); color: #333;
  }
  .ico { background: #fff; border: 1px solid #ccc; border-radius: 12px; cursor: pointer;
         width: 4cqw; height: 4cqw; min-width: 30px; min-height: 30px; font-size: max(14px, 2cqw); }
  .ico.rec { background: #e86a6a; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(232,106,106,.3); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="ai-character-widget">
  <!-- 2. 角色圖片 / 說話動畫層 -->
  <div id="char-layer"><img id="char-img" alt="青青" draggable="false"></div>

  <!-- 3. 對話框層 -->
  <div id="chat-bubble-container"></div>
  <div id="chat-text">你好，我是青青，歡迎跟我說話喔！</div>
  <div id="controls">
      <button id="talk-btn">點擊與我對話</button>
      <button class="ico" id="tts" title="語音開/關" aria-label="語音開關" hidden>🔊</button>
      <input id="msg" type="text" placeholder="跟青青說說話…" autocomplete="off" enterkeyhint="send" hidden>
      <button class="ico" id="mic" title="語音輸入" aria-label="語音輸入" hidden>🎤</button>
      <button id="send" hidden>送出</button>
  </div>
</div>

<script>
/* ===================== 設定區 ===================== */
const CONFIG = {
  IMG_IDLE:   "https://res.cloudinary.com/c05zlkva/image/upload/v1793263310/%E4%B8%BB%E8%A7%921.png",
  IMG_SPEAK:  "https://res.cloudinary.com/c05zlkva/image/upload/v1793263852/AISPEAK.gif",
  IMG_BG:     "https://res.cloudinary.com/c05zlkva/image/upload/v1793264253/%E8%83%8C%E6%99%AF1.png",
  IMG_BUBBLE: "https://res.cloudinary.com/c05zlkva/image/upload/v1793264208/%E5%B0%8D%E8%A9%B1%E6%A1%86-07.png",

  // AI 後端網址（Cloudflare Worker，見 README.md）。留空 = 離線示範模式。
  // ⚠️ 請勿把任何 API 金鑰寫在這個檔案裡，GitHub Pages 是公開的。
  API_ENDPOINT: "https://qingqing-ai.luxurwind.workers.dev/",

  GREETING: "你好，我是青青，歡迎跟我說話喔！",
  MAX_HISTORY: 12,
  TYPE_SPEED: 45,       // 打字速度（毫秒/字）
  TTS_LANG: "zh-TW",
};

/* ===================== 初始化 ===================== */
const $ = id => document.getElementById(id);
const widget = $("ai-character-widget"), charImg = $("char-img"), chatText = $("chat-text"),
      talkBtn = $("talk-btn"), msg = $("msg"), sendBtn = $("send"), micBtn = $("mic"), ttsBtn = $("tts");

widget.style.backgroundImage = `url("${CONFIG.IMG_BG}")`;
$("chat-bubble-container").style.backgroundImage = `url("${CONFIG.IMG_BUBBLE}")`;
charImg.src = CONFIG.IMG_IDLE;
new Image().src = CONFIG.IMG_SPEAK;   // 預載說話動畫

let history = [], busy = false, ttsOn = true, typeTimer = null, speakToken = 0;
const synth = "speechSynthesis" in window ? window.speechSynthesis : null;

/* ===================== 角色狀態 ===================== */
function setSpeaking(on) {
  // 加上時間戳，讓 GIF 每次都從頭播放
  charImg.src = on ? CONFIG.IMG_SPEAK + (CONFIG.IMG_SPEAK.includes("?") ? "&" : "?") + "t=" + Date.now()
                   : CONFIG.IMG_IDLE;
}

/* ===================== 說話：打字 + 語音 + 動畫同步 ===================== */
function pickVoice() {
  const vs = synth.getVoices();
  return vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /zh/i.test(v.lang)) || null;
}

function say(text) {
  return new Promise(resolve => {
    const token = ++speakToken;
    clearInterval(typeTimer);
    synth && synth.cancel();
    chatText.textContent = "";
    chatText.classList.add("cursor");
    setSpeaking(true);

    const chars = Array.from(text);
    let i = 0, typed = false, spoken = !(ttsOn && synth);
    const finish = () => {
      if (token !== speakToken || !(typed && spoken)) return;
      chatText.classList.remove("cursor");
      setSpeaking(false);
      resolve();
    };

    typeTimer = setInterval(() => {
      if (token !== speakToken) { clearInterval(typeTimer); return; }
      chatText.textContent += chars[i++];
      chatText.scrollTop = chatText.scrollHeight;
      if (i >= chars.length) { clearInterval(typeTimer); typed = true; finish(); }
    }, CONFIG.TYPE_SPEED);

    if (!spoken) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = CONFIG.TTS_LANG; u.rate = 1.05; u.pitch = 1.5;   // 音調稍高，貼近正太感
      const v = pickVoice(); if (v) u.voice = v;
      u.onend = u.onerror = () => { spoken = true; finish(); };
      synth.speak(u);
    }
  });
}

/* ===================== AI 對話 ===================== */
const DEMO_REPLIES = [
  [/你好|哈囉|嗨|hi|hello/i, "哈囉～我是青青，見到你我『青』不自禁笑了！"],
  [/名字|你是誰|叫什麼/, "我叫青青！不是情情，是青青草原的青～"],
  [/作品|設計|案例/, "每件作品都超用心，連我看了都『設』不得走！"],
  [/價|錢|費用|報價/, "價格找設計師聊最準，我只負責開心～"],
  [/謝謝|感謝/, "不客氣～你開心，青青就開心！"],
];
const demoReply = t => (DEMO_REPLIES.find(([re]) => re.test(t)) || [])[1]
  || "青青聽到了！（離線示範中，接上 AI 後就能暢聊囉）";

async function askAI(userText) {
  history.push({ role: "user", content: userText });
  history = history.slice(-CONFIG.MAX_HISTORY);

  if (!CONFIG.API_ENDPOINT) {
    await new Promise(r => setTimeout(r, 500));
    const reply = demoReply(userText);
    history.push({ role: "assistant", content: reply });
    return reply;
  }
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    const res = await fetch(CONFIG.API_ENDPOINT, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }), signal: ctrl.signal,
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const reply = ((await res.json()).reply || "").trim();
    if (!reply) throw new Error("empty reply");
    history.push({ role: "assistant", content: reply });
    return reply;
  } finally { clearTimeout(timer); }
}

async function handleSend() {
  const text = msg.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true; msg.value = "";
  synth && synth.cancel();
  chatText.classList.remove("cursor");
  chatText.textContent = "青青想一想…";
  try {
    await say(await askAI(text));
  } catch (err) {
    console.error(err);
    history.pop();   // 失敗的提問不留在歷史
    await say("哎呀，青青剛剛有點恍神，可以再說一次嗎？");
  } finally {
    busy = false; sendBtn.disabled = false; msg.focus({ preventScroll: true });
  }
}

/* ===================== 事件 ===================== */
sendBtn.addEventListener("click", handleSend);
msg.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); handleSend(); }  // 注音選字時不誤送
});

ttsBtn.addEventListener("click", () => {
  ttsOn = !ttsOn; ttsBtn.textContent = ttsOn ? "🔊" : "🔇";
  if (!ttsOn && synth) synth.cancel();
});

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const rec = new SR(); rec.lang = CONFIG.TTS_LANG; rec.interimResults = false;
  rec.onresult = e => { msg.value = e.results[0][0].transcript; handleSend(); };
  rec.onend = rec.onerror = () => micBtn.classList.remove("rec");
  micBtn.addEventListener("click", () => {
    if (busy) return;
    synth && synth.cancel();
    try { rec.start(); micBtn.classList.add("rec"); } catch (_) {}
  });
}

// 點擊「與我對話」＝使用者手勢，瀏覽器才允許播放語音
talkBtn.addEventListener("click", async () => {
  talkBtn.hidden = true;
  [ttsBtn, msg, sendBtn].forEach(e => e.hidden = false);
  micBtn.hidden = !SR;
  synth && synth.getVoices();
  await say(CONFIG.GREETING);
  msg.focus({ preventScroll: true });
});
</script>
</body>
</html>
